name: Build and Release IWA

# TODO: alpha channel  = main, nightly channel = int
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'For int: version override (leave empty to auto-increment). For main: version to promote to stable (required).'
        required: false

permissions:
  contents: write

concurrency:
  group: iwa-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == 'int'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: int
          fetch-depth: 0

      - name: Refresh integration branch and tags
        run: |
          git fetch origin int --tags --force
          git checkout -B int origin/int

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: pnpm install

      - name: Fetch existing iwa-updates.json
        run: |
          gh release download iwa-manifest \
            -p iwa-updates.json -D . --clobber 2>/dev/null || echo '{"versions":[],"channels":{"default":{"name":"Stable"},"nightly":{"name":"Nightly"}}}' > iwa-updates.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version
        id: version
        shell: bash
        run: |
          VERSION_INPUT="${{ github.event.inputs.version }}"
          if [ -n "$VERSION_INPUT" ]; then
            VERSION="${VERSION_INPUT#v}"
            VERSION="${VERSION#darc-v}"
          else
            LATEST_VERSION=""
            while IFS= read -r TAG; do
              if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
                LATEST_VERSION="${BASH_REMATCH[1]}"
                break
              fi
            done < <(git tag --list 'v*' --sort=-version:refname)

            if [ -z "$LATEST_VERSION" ]; then
              LATEST_VERSION="0.0.0"
            fi

            IFS=. read -r VERSION_MAJOR VERSION_MINOR VERSION_PATCH <<< "$LATEST_VERSION"
            VERSION="${VERSION_MAJOR}.${VERSION_MINOR}.$((VERSION_PATCH + 1))"
          fi

          VERSION_COMPONENT='(0|[1-9][0-9]{0,8})'
          if [[ ! "$VERSION" =~ ^${VERSION_COMPONENT}\.${VERSION_COMPONENT}\.${VERSION_COMPONENT}$ ]]; then
            echo "::error::Invalid release version: ${VERSION}"
            exit 1
          fi

          VERSION_TAG="v${VERSION}"
          if git show-ref --tags --verify --quiet "refs/tags/${VERSION_TAG}"; then
            echo "::error::Release tag ${VERSION_TAG} already exists. Choose a new version or leave the version input empty."
            exit 1
          fi

          export VERSION
          export CHANNEL="nightly"
          export VERSION_TAG
          export REPO="${{ github.repository }}"
          node bump_version.js

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"

      # FIXME: use secret env var instead of file!
      - name: Write signing key
        run: |
          mkdir -p certs
          echo "${{ secrets.IWA_SIGNING_KEY }}" > certs/iwa_signing_key.pem

      - name: Build app
        run: pnpm build

      - name: Build signed bundle
        run: node build-swbn.js

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json public/.well-known/manifest.webmanifest
          git diff --cached --quiet || git commit -m "release: v${{ steps.version.outputs.version }}"
          git push origin int

      - name: Create or update version release
        run: |
          TAG="${{ steps.version.outputs.version_tag }}"
          HEAD_SHA=$(git rev-parse HEAD)
          REMOTE_TAG_SHA=$(git ls-remote --tags origin "refs/tags/${TAG}" | cut -f1)

          if [ -n "$REMOTE_TAG_SHA" ]; then
            if [ "$REMOTE_TAG_SHA" != "$HEAD_SHA" ]; then
              echo "::error::Tag ${TAG} already points to ${REMOTE_TAG_SHA}, expected ${HEAD_SHA}. Refusing to move an existing release tag."
              exit 1
            fi
            echo "Reusing existing tag ${TAG} at ${HEAD_SHA}"
          else
            git tag "$TAG"
            git push origin "refs/tags/${TAG}"
          fi

          if gh release view "$TAG" &>/dev/null; then
            gh release upload "$TAG" --clobber darc.swbn
            gh release edit "$TAG" \
              --title "v${{ steps.version.outputs.version }}" \
              --notes "v${{ steps.version.outputs.version }} from commit ${HEAD_SHA}" \
              --prerelease
          else
            gh release create "$TAG" \
              --title "v${{ steps.version.outputs.version }}" \
              --notes "v${{ steps.version.outputs.version }} from commit ${HEAD_SHA}" \
              --prerelease \
              darc.swbn
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update unified iwa-updates.json
        run: |
          if gh release view iwa-manifest &>/dev/null; then
            gh release upload iwa-manifest --clobber iwa-updates.json
          else
            gh release create iwa-manifest \
              --title "IWA Update Manifest" \
              --notes "Unified update manifest for all channels. Do not delete." \
              iwa-updates.json
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Xe Launcher version update
        run: |
          gh api \
            --method POST \
            repos/Agent54/xe-computer-launcher/actions/workflows/xe-computer-version-bump.yml/dispatches \
            --raw-field ref=int \
            --raw-field "inputs[version]=${{ steps.version.outputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.XE_LAUNCHER_TOKEN }}

  promote:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Validate version input
        run: |
          if [ -z "${{ github.event.inputs.version }}" ]; then
            echo "::error::Version is required when promoting to stable. Specify the nightly version to promote."
            exit 1
          fi

      - name: Verify nightly release exists
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          VERSION_TAG="v${VERSION}"
          if ! gh release view "$VERSION_TAG" &>/dev/null; then
            echo "::error::Release $VERSION_TAG not found. Build it on int first."
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_tag=$VERSION_TAG" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch iwa-updates.json
        run: |
          gh release download iwa-manifest -p iwa-updates.json -D . --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add default channel to version
        run: |
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('./iwa-updates.json','utf-8'));
            const v = '${{ steps.version.outputs.version }}';
            const entry = m.versions.find(e => e.version === v);
            if (!entry) { console.error('Version ' + v + ' not found in iwa-updates.json'); process.exit(1); }
            if (!entry.channels.includes('default')) entry.channels.push('default');
            fs.writeFileSync('./iwa-updates.json', JSON.stringify(m, null, 2));
            console.log('Promoted v' + v + ' to channels:', entry.channels);
          "

      - name: Mark release as stable
        run: |
          gh release edit ${{ steps.version.outputs.version_tag }} --prerelease=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload updated iwa-updates.json
        run: |
          gh release upload iwa-manifest --clobber iwa-updates.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
